[project]
name = "markable"
version = "0.1.0"
description = "Assessment preparation, AI-marking, and curriculum-intelligence pipeline for paper-based school assessments."
authors = [{ name = "Matthew Lander" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "segno>=1.6",
    "typst>=0.11",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Scan-time libraries (`markable scan`). Kept out of the core install so the
# ingest/build path stays lean. Self-contained wheels only: OpenCV's QR
# detector replaces pyzbar (no system zbar), pypdfium2 replaces
# pdf2image (no system poppler).
scan = [
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
# AI-assisted ingestion of .docx/.pdf drafts and (later) the marking engine.
ai = [
    "anthropic>=0.34",
]

[project.scripts]
markable = "markable.cli:app"

[dependency-groups]
# Dev includes the scan-extra libs so the offline digital round-trip tests
# (build → rasterize → scan → crop) always run in development.
dev = [
    "pytest>=8.2",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
